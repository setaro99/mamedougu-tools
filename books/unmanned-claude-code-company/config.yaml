title: "Claude Code × GitHub Actions で“無人で回る”会社を作る（71日の実測ベース）"
summary: |
  cron＋GitHub Actions 上の Claude Code を「人が見ていない夜間」に回したい人へ。cron はどれだけ遅延するのか、「success なのに何もしていない」回をどう検知するのか、トークンが失効して黙って止まったらどう気づくのか——こうした無人運用の落とし穴と回避策を、71〜83 営業日ぶんの一次記録（Actions のログ・日報・意思決定ログ）から再構成した実装書です。
  扱うのは、cron 遅延の実測値、GITHUB_TOKEN がワークフローを push できない制約、データセンター IP からのボット判定、「success なのに成果ゼロ」の検知、クラウドと手元 PC の二層で片方の成果が黙って消えない設計、そして「賢いモデルに気を利かせて即興させない」手順書優先の作り方。巻末の第 6 章に、そのまま使える雛形 6 本（定時ワークフロー・日報ガード・憲法ファイル・二層競合防止・決裁箱ほか）を「改変してよい箇所／触ってはいけない箇所」の注記つきで載せます。
  数値は一次記録で裏取りしたものだけを載せ、推測は「推測」と明記します。「はじめに」と第 1 章は無料で読めるので、そこまでで判断してください。向いていない用途と限界（無人で「回る」ことと事業が「当たる」ことは別で、運営元は執筆時点で売上 ¥0）も、あとがきで正直に書きます。
